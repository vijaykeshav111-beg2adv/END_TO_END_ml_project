<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account · Vijayvargiya Clinic</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-page"><div class="auth-shell"><a class="brand auth-brand" href="/"><span class="brand-mark">+</span><span>Vijayvargiya Clinic</span></a><div class="form-card auth-card wide"><span class="eyebrow">Patient portal</span><h1>Create your account</h1><p>One account for appointments and your patient dashboard.</p>{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}<form method="post" action="/signup" class="form-stack"><div class="two-col"><label>Full name<input name="full_name" value="{{ form_data.full_name|default('') }}" required></label><label>Email<input type="email" name="email" value="{{ form_data.email|default('') }}" required></label></div><div class="two-col"><label>Phone<input name="phone" value="{{ form_data.phone|default('') }}"></label><label>Date of birth<input type="date" name="date_of_birth" value="{{ form_data.date_of_birth|default('') }}"></label></div><label>Gender<select name="gender"><option value="">Prefer not to say</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></label><div class="two-col"><label>Password<input type="password" name="password" required></label><label>Confirm password<input type="password" name="confirm_password" required></label></div><button class="btn btn-primary btn-block" type="submit">Create Account</button></form><p class="form-footer">Already registered? <a href="/login">Login</a></p></div></div></body></html>
