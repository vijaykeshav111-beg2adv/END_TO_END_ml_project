<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Health Assistant | Vijayvargiya Clinic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .chat-container {

            width: 95%;

            max-width: 900px;

            height: 90vh;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.12);

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }

        .chat-header {

            background: #1769aa;

            color: white;

            padding: 20px;

            text-align: center;
        }

        .chat-header h2 {

            margin: 0 0 5px 0;
        }

        .chat-header p {

            margin: 0;

            font-size: 14px;

            opacity: 0.9;
        }

        .chat-messages {

            flex: 1;

            overflow-y: auto;

            padding: 25px;

            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .message {

            max-width: 75%;

            padding: 12px 16px;

            border-radius: 15px;

            line-height: 1.5;

            white-space: pre-wrap;
        }

        .user {

            align-self: flex-end;

            background: #1769aa;

            color: white;

            border-bottom-right-radius: 4px;
        }

        .assistant {

            align-self: flex-start;

            background: #eef3f8;

            color: #222;

            border-bottom-left-radius: 4px;
        }

        .typing {

            color: #666;

            font-style: italic;
        }

        .chat-input-area {

            border-top: 1px solid #ddd;

            padding: 15px;

            display: flex;

            gap: 10px;
        }

        #messageInput {

            flex: 1;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        #sendButton {

            border: none;

            background: #1769aa;

            color: white;

            padding: 0 22px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        #sendButton:hover {

            background: #0d527f;
        }

        #sendButton:disabled {

            background: #999;

            cursor: not-allowed;
        }

        .disclaimer {

            font-size: 11px;

            text-align: center;

            color: #777;

            padding: 8px;
        }

    </style>

</head>


<body>

<div class="chat-container">

    <div class="chat-header">

        <h2>
            Vijayvargiya Clinic AI Assistant
        </h2>

        <p>
            Ask general health-related questions
        </p>

    </div>


    <div
        id="chatMessages"
        class="chat-messages"
    >

        <div class="message assistant">

            Hello! I am the Vijayvargiya Clinic
            AI assistant.

            How can I help you today?

        </div>

    </div>


    <div class="disclaimer">

        This AI provides general information and
        does not replace professional medical advice.

    </div>


    <div class="chat-input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
        >
            Send
        </button>

    </div>

</div>


<script>

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );


function addMessage(
    message,
    role
) {

    const div =
        document.createElement("div");

    div.classList.add(
        "message",
        role
    );

    div.textContent = message;

    chatMessages.appendChild(div);

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        message,
        "user"
    );

    messageInput.value = "";

    sendButton.disabled = true;

    const typing =
        document.createElement("div");

    typing.classList.add(
        "message",
        "assistant",
        "typing"
    );

    typing.textContent =
        "AI is thinking...";

    chatMessages.appendChild(
        typing
    );

    chatMessages.scrollTop =
        chatMessages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/ai/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        const data =
            await response.json();


        typing.remove();


        if (!response.ok) {

            addMessage(
                data.detail ||
                data.message ||
                "Something went wrong.",
                "assistant"
            );

            return;
        }


        if (
            data.success &&
            data.message
        ) {

            addMessage(
                data.message,
                "assistant"
            );

        } else {

            addMessage(
                data.message ||
                "AI could not generate a response.",
                "assistant"
            );
        }


    } catch (error) {

        typing.remove();

        addMessage(
            "Unable to connect to the AI service.",
            "assistant"
        );

        console.error(error);

    } finally {

        sendButton.disabled = false;

        messageInput.focus();
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


messageInput.focus();

</script>

</body>

</html>
